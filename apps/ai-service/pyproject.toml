[project]
name = "ai-service"
version = "0.1.0"
description = "HireWise AI Orchestration and Multi-Agent Recruitment Service"
readme = "README.md"
authors = [
    { name = "Nadil-Dulnidu", email = "nzinlud963@gmail.com" },
    { name = "Pamindu-Rashmitha", email = "pamidurashmitha@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langchain>=0.2.14",
    "langgraph>=0.2.0",
    "langchain-google-genai>=1.0.8",
    "psycopg[binary,pool]>=3.2.1",
    "psycopg-pool>=3.2.1",
    "httpx>=0.27.0",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
ai-service = "ai_service.main:start"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

